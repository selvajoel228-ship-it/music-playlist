<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Soundwave - Your premium music streaming experience. Listen to your favorite tracks in style." />
  <title>Soundwave – Music for Everyone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Circular+Std:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" fill="#1DB954"/>
        <path d="M7 9.5C9.5 8 14.5 8 17 9.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M7.5 12C9.5 10.8 14.5 10.8 16.5 12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M8.5 14.5C10 13.6 14 13.6 15.5 14.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Soundwave</span>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" id="nav-home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item" id="nav-search">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>Search</span>
      </a>
      <a href="#" class="nav-item" id="nav-library">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 5h-3v5.5a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1 2.5-2.5c.57 0 1.08.19 1.5.51V5h4v2zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6z"/></svg>
        <span>Your Library</span>
      </a>
    </nav>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <button class="create-playlist-btn" id="create-playlist-btn">
        <span class="plus-icon">+</span>
        Create Playlist
      </button>
      <a href="#" class="nav-item liked-songs-btn">
        <div class="liked-icon-wrap">
          <svg viewBox="0 0 24 24" fill="white" width="14" height="14"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <span>Liked Songs</span>
      </a>
    </div>

    <div class="sidebar-divider"></div>

    <div class="playlist-list" id="playlist-list">
      <p class="playlist-heading">PLAYLISTS</p>
      <a href="#" class="playlist-link active-playlist">My Favorites</a>
      <a href="#" class="playlist-link">Chill Vibes</a>
      <a href="#" class="playlist-link">Workout Mix</a>
      <a href="#" class="playlist-link">Late Night Drive</a>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content" id="main-content">

    <!-- Top Bar -->
    <header class="topbar" id="topbar">
      <div class="topbar-nav">
        <button class="topbar-btn" id="btn-back" aria-label="Go back">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button class="topbar-btn" id="btn-forward" aria-label="Go forward">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
      </div>
      <div class="topbar-search" id="topbar-search-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor" class="search-icon-sm"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" placeholder="What do you want to listen to?" class="topbar-search-input" id="search-input" />
      </div>
      <div class="topbar-user">
        <button class="user-btn upgrade-btn" id="upgrade-btn">Upgrade</button>
        <div class="user-avatar" id="user-avatar">U</div>
      </div>
    </header>

    <!-- Hero / Featured Section -->
    <section class="hero-section" id="hero-section">
      <div class="hero-greeting" id="hero-greeting">Good Evening 🌙</div>

      <!-- Quick Access Grid -->
      <div class="quick-access-grid" id="quick-access-grid">
        <div class="quick-card" data-song-index="0" id="quick-card-0">
          <div class="quick-card-art" style="background: linear-gradient(135deg, #6B21A8, #DB2777, #F59E0B);">
            <svg viewBox="0 0 24 24" fill="white" width="22" height="22"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          </div>
          <span>Nallaru Po</span>
          <button class="quick-play-btn" aria-label="Play Nallaru Po">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
        </div>
        <div class="quick-card" data-song-index="1" id="quick-card-1">
          <div class="quick-card-art" style="background: linear-gradient(135deg, #1E3A5F, #0F4C75, #1B6CA8);">
            <svg viewBox="0 0 24 24" fill="white" width="22" height="22"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          </div>
          <span>Blud Is On His Way</span>
          <button class="quick-play-btn" aria-label="Play Blud Is On His Way">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
        </div>
        <div class="quick-card" data-song-index="0" id="quick-card-2">
          <div class="quick-card-art" style="background: linear-gradient(135deg, #064E3B, #065F46, #047857);">
            <svg viewBox="0 0 24 24" fill="white" width="22" height="22"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <span>Liked Songs</span>
          <button class="quick-play-btn" aria-label="Play Liked Songs">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
        </div>
        <div class="quick-card" data-song-index="1" id="quick-card-3">
          <div class="quick-card-art" style="background: linear-gradient(135deg, #7C2D12, #B45309, #F59E0B);">
            <svg viewBox="0 0 24 24" fill="white" width="22" height="22"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
          </div>
          <span>My Playlist</span>
          <button class="quick-play-btn" aria-label="Play My Playlist">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Recently Played -->
    <section class="content-section" id="recently-played-section">
      <div class="section-header">
        <h2 class="section-title">Recently Played</h2>
        <a href="#" class="section-see-all">See all</a>
      </div>
      <div class="cards-grid" id="recently-played-grid">
        <!-- Dynamically generated -->
      </div>
    </section>

    <!-- Featured Playlist -->
    <section class="content-section" id="featured-section">
      <div class="section-header">
        <h2 class="section-title">Featured Tracks</h2>
        <a href="#" class="section-see-all">See all</a>
      </div>
      <div class="cards-grid" id="featured-grid">
        <!-- Dynamically generated -->
      </div>
    </section>

  </main>

  <!-- ===== RIGHT PANEL (Queue) ===== -->
  <aside class="right-panel" id="right-panel">
    <div class="panel-header">
      <h3>Queue</h3>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="queue-section">
      <p class="queue-label">Now Playing</p>
      <div class="queue-item active" id="queue-now-playing">
        <div class="queue-art" id="queue-art-now"></div>
        <div class="queue-info">
          <span class="queue-title" id="queue-title-now">–</span>
          <span class="queue-artist" id="queue-artist-now">–</span>
        </div>
      </div>
    </div>
    <div class="queue-section">
      <p class="queue-label">Next Up</p>
      <div id="queue-next-list"></div>
    </div>
  </aside>

  <!-- ===== BOTTOM PLAYER ===== -->
  <footer class="player" id="player">

    <!-- Now Playing Info -->
    <div class="player-now-playing" id="player-now-playing">
      <div class="player-art-wrap">
        <div class="player-art" id="player-art"></div>
        <div class="player-art-shine"></div>
      </div>
      <div class="player-meta">
        <div class="player-song-title" id="player-song-title">Select a song</div>
        <div class="player-song-artist" id="player-song-artist">–</div>
      </div>
      <div class="player-actions-mini">
        <button class="action-btn like-btn" id="like-btn" aria-label="Like">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
        <button class="action-btn" id="add-to-queue-btn" aria-label="Add to queue">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm13 2.5V13h-2v5.5l4.25 2.5.75-1.23-3-1.77z"/></svg>
        </button>
      </div>
    </div>

    <!-- Player Controls -->
    <div class="player-center">
      <div class="player-controls">
        <button class="ctrl-btn" id="btn-shuffle" aria-label="Shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-prev" aria-label="Previous" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-pause-btn" id="btn-play-pause" aria-label="Play/Pause">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" aria-label="Next" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-repeat" aria-label="Repeat" title="Repeat">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>
      <div class="progress-row">
        <span class="time-label" id="time-current">0:00</span>
        <div class="progress-bar-wrap" id="progress-bar-wrap">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
            <div class="progress-thumb" id="progress-thumb"></div>
          </div>
        </div>
        <span class="time-label" id="time-total">0:00</span>
      </div>
    </div>

    <!-- Player Right Controls -->
    <div class="player-right">
      <button class="action-btn" id="btn-queue" aria-label="Queue" title="Queue">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      </button>
      <button class="action-btn" id="btn-device" aria-label="Devices" title="Devices">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      </button>
      <div class="volume-row">
        <button class="action-btn vol-icon" id="btn-mute" aria-label="Mute/Unmute">
          <svg class="icon-vol-full" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg class="icon-vol-mute" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <div class="volume-bar-wrap" id="volume-bar-wrap">
          <div class="volume-bar-bg">
            <div class="volume-bar-fill" id="volume-fill"></div>
            <div class="volume-thumb" id="volume-thumb"></div>
          </div>
        </div>
      </div>
    </div>

  </footer>

  <!-- Hidden audio element -->
  <audio id="audio-player" preload="auto"></audio>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
